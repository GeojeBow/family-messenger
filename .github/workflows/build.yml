name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Publish a release with this version, e.g. 1.0.0 (leave empty to only build)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # The signing key lives in the repo only in encrypted form; the password
      # is the KEYSTORE_PASSWORD repository secret. On the first build after the
      # secret is added, a new key is generated, encrypted and committed.
      - name: Prepare signing key
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        if: env.KEYSTORE_PASSWORD != ''
        run: |
          ENC=android/app/upload-keystore.jks.enc
          if [ ! -f "$ENC" ]; then
            if [ "$GITHUB_REF_TYPE" != branch ]; then
              echo "No signing key yet. Run this workflow on main first."; exit 1
            fi
            keytool -genkeypair -keystore android/app/upload-keystore.jks -storetype PKCS12 \
              -alias urikkiri -keyalg RSA -keysize 4096 -validity 10000 \
              -storepass "$KEYSTORE_PASSWORD" -keypass "$KEYSTORE_PASSWORD" -dname "CN=Urikkiri"
            openssl enc -aes-256-cbc -pbkdf2 -iter 600000 -salt -pass env:KEYSTORE_PASSWORD \
              -in android/app/upload-keystore.jks -out "$ENC"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$ENC"
            git commit -m "Add encrypted release signing key"
            git push origin "HEAD:$GITHUB_REF_NAME"
          else
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -pass env:KEYSTORE_PASSWORD \
              -in "$ENC" -out android/app/upload-keystore.jks
          fi

      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: urikkiri
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Refuse unsigned release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release' || inputs.release_version != ''
        run: test -f android/app/upload-keystore.jks

      - run: mv build/app/outputs/flutter-apk/app-release.apk urikkiri.apk

      - uses: actions/upload-artifact@v4
        with:
          name: urikkiri-apk
          path: urikkiri.apk

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release' || inputs.release_version != ''
        uses: softprops/action-gh-release@v2
        with:
          files: urikkiri.apk
          make_latest: true
          tag_name: ${{ inputs.release_version != '' && format('v{0}', inputs.release_version) || '' }}
          name: ${{ inputs.release_version != '' && format('우리끼리 {0}', inputs.release_version) || '' }}
          target_commitish: ${{ github.sha }}
